name: Mac app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install overlay dependencies
        working-directory: mac-overlay
        run: npm install

      - name: Build universal dmg
        working-directory: mac-overlay
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dmg --universal --publish never

      - name: Build arm64 and x64 zip
        working-directory: mac-overlay
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac zip --arm64 --x64 --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-app
          path: |
            mac-overlay/dist/*.dmg
            mac-overlay/dist/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v1.0.${{ github.run_number }}"
          notes='未簽署的 Mac app。下載 dmg 後把「工作坊彈幕」拖到「應用程式」。第一次請按右鍵選「打開」。若系統說已損毀，執行：xattr -cr /Applications/工作坊彈幕.app'
          gh release create "$tag" mac-overlay/dist/*.dmg mac-overlay/dist/*.zip \
            --title "工作坊彈幕 ${tag}" \
            --notes "$notes"
